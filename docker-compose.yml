services:
  www:
    build: .
    ports:
      - 80:80
    volumes:
      - ./src/public:/var/www/html/
      - ./src/app:/var/www/app/
      - ./src/mysql_data:/var/www/mysql_data/
    depends_on:
      - db
  db:
    image: mysql:9.4.0
    expose:
      - 3306
    environment:
      MYSQL_DATABASE: transfer
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./src/mysql_data:/var/lib/mysql
      - ./src/app/database:/docker-entrypoint-initdb.d:ro
  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - db
    ports:
      - 8080:80
    environment:
      PMA_HOST: db